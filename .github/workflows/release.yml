name: Release and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version Change
        id: check
        run: |
          new_version=$(jq -r '.version // empty' package.json)
          if [ -z "$new_version" ]; then
            echo "Error: Cannot find version in package.json" >&2
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "new_version=$new_version" >> $GITHUB_OUTPUT

          # 手动触发时，直接发布当前版本
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered manually via workflow_dispatch. Releasing version $new_version"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 获取上一次状态中的旧版本号
          old_version=""
          before_sha="${{ github.event.before }}"
          if [ -n "$before_sha" ] && [ "$before_sha" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before_sha" 2>/dev/null; then
            old_version=$(git show "$before_sha":package.json 2>/dev/null | jq -r '.version // empty' || echo "")
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            old_version=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version // empty' || echo "")
          fi

          echo "Old version: '$old_version'"
          echo "New version: '$new_version'"

          # 只要新版本不为空且与旧版本不同，即触发发布
          if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
            echo "Version changed from '$old_version' to '$new_version'"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No version change detected"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --ignore-scripts
      - name: Build for ${{ matrix.os }}
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            bun run build:mac
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            bun run build:linux
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            bun run build:win64
          fi
        shell: bash
      - name: Get Asset Details
        id: get_asset
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "asset_path=./dist/*.dmg" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            echo "asset_path=./dist/*.AppImage" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            echo "asset_path=./dist/*.exe" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: v${{ needs.check-version-change.outputs.new_version }}
          name: v${{ needs.check-version-change.outputs.new_version }}
          draft: false
          prerelease: false
          files: ${{ steps.get_asset.outputs.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
